<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jogo da memória com baralhos ilustrados.">
  <title>Ás da Memória</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="saltar" href="#conteudo">Saltar para o conteúdo</a>

  <header class="cabecalho">
    <button class="logo" type="button" data-seccao="inicio">
      <span class="logo-naipe" aria-hidden="true">♠</span>
      Ás da Memória
    </button>

    <nav class="menu" aria-label="Principal">
      <ul>
        <li><button class="menu-link" type="button" data-seccao="inicio" aria-current="page">Mesa</button></li>
        <li><button class="menu-link" type="button" data-seccao="ranking">Ranking</button></li>
        <li><button class="menu-link" type="button" data-seccao="como-jogar">Como jogar</button></li>
      </ul>
    </nav>

    <div class="cabecalho-acoes">
      <label class="seletor-baralho">
        <span>Baralho</span>
        <select id="seletor-baralho">
          <option value="classico">Clássico</option>
          <option value="vitral">Vitral</option>
          <option value="azulejo">Azulejo</option>
        </select>
      </label>

      <button id="btn-tema" class="btn-tema" type="button" aria-pressed="false">Modo escuro</button>
    </div>
  </header>

  <main id="conteudo">
    <section id="inicio" class="seccao seccao-inicio" aria-labelledby="titulo-inicio">
      <div class="inicio-titulo">
        <h1 id="titulo-inicio">Ás da Memória</h1>
        <p class="subtitulo">Um jogo clássico de cartas ilustradas.</p>
      </div>

      <div class="leque" aria-hidden="true">
        <div class="leque-carta leque-carta-esquerda"></div>
        <div class="leque-carta leque-carta-direita"></div>
        <div class="leque-carta leque-carta-frente"></div>
      </div>

      <form id="form-partida" class="cartao-partida">
        <h2>Nova partida</h2>

        <label for="nome-jogador">O teu nome</label>
        <input id="nome-jogador" name="nome" type="text" maxlength="20" autocomplete="nickname" placeholder="Ex.: Ana" required>

        <fieldset class="niveis">
          <legend>Nível</legend>

          <label class="opcao-nivel">
            <input type="radio" name="nivel" value="facil">
            <span>Fácil</span>
            <small>12 cartas · 6 pares</small>
          </label>

          <label class="opcao-nivel">
            <input type="radio" name="nivel" value="medio" checked>
            <span>Médio</span>
            <small>16 cartas · 8 pares</small>
          </label>

          <label class="opcao-nivel">
            <input type="radio" name="nivel" value="dificil">
            <span>Difícil</span>
            <small>24 cartas · 12 pares</small>
          </label>
        </fieldset>

        <button id="btn-jogar" class="btn btn-principal" type="submit">Jogar</button>
      </form>

      <p class="recorde">
        Recorde a bater: <strong id="recorde">—</strong>
        <button class="btn-link" type="button" data-seccao="ranking">Ver ranking</button>
      </p>
    </section>
    
    <section id="jogo" class="seccao seccao-jogo" aria-labelledby="titulo-jogo" hidden>
      <h2 id="titulo-jogo">Partida em curso</h2>
      <p id="mensagem-jogo" class="mensagem" aria-live="polite"></p>

      <div id="grelha" class="grelha">
        <!-- CARTA DE TESTE: só para estilizar no CSS. Apagar quando o JS gerar as cartas. -->
        <button class="carta" type="button" aria-label="Carta virada para baixo">
          <span class="carta-face carta-verso"></span>
          <span class="carta-face carta-frente">
            <img src="img/baralhos/classico/rei-espadas.webp" alt="Rei de Espadas">
          </span>
        </button>
      </div>

      <div class="barra-jogo">
        <p class="barra-jogador">
          <span id="info-jogador">Jogador</span> · <span id="info-nivel">Médio</span>
        </p>

        <dl class="estatisticas">
          <div>
            <dt>Tempo</dt>
            <dd id="tempo">0:00</dd>
          </div>
          <div>
            <dt>Jogadas</dt>
            <dd id="jogadas">0</dd>
          </div>
          <div>
            <dt>Pares</dt>
            <dd id="pares">0/8</dd>
          </div>
        </dl>

        <div class="barra-acoes">
          <button id="btn-reiniciar" class="btn btn-principal" type="button">Reiniciar</button>
          <button id="btn-sair" class="btn btn-secundario" type="button">Sair</button>
        </div>
      </div>
    </section>

    <!-- PARTE 4: secções ranking e como jogar -->
  </main>

  <!-- PARTE 5: diálogo de vitória -->

  <footer class="rodape">
    <p>Ás da Memória — Projeto 2 de JavaScript · UpSkill / IPCA <span id="ano"></span></p>
  </footer>
</body>
</html>
